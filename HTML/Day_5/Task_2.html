<!DOCTYPE html>
<html>

<head>
    <title>
        Student Registration Form
    </title>

</head>

<body>
    <h1> Student Registration Form </h1>
    <form>
        <label for="name"> Name : </label>
        <input type="text" id="name" name="name">
        <br> <br>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email">
        <br> <br>

        <label for="password"> Password: </label>
        <input type="password" id="password" name="password">
        <br> <br>

        <label for="age"> Age: </label>
        <input type="number" id="age" name="age">
        <br> <br>


        <label for="dob"> Date of Birth: </label>
        <input type="date" id="dob" name="dob">
        <br> <br>


        <label> Gender : </label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male"> Male </label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female"> Female </label>

        <br> <br>

        <label for="course"> Course : </label>
        <select name="course" id="course">
            <option value="">Select Course </option>
            <option value=" fullstack "> Full Stack Developement </option>
            <option value="java"> Java </option>
            <option value="python"> Python </option>
            <option value="dsta-science ">Data Science </option>

        </select>

        <br> <br>

        <label> Skills : </label>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html"> HTML </label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css"> CSS </label>

        <input type="checkbox" id="javascript" name="skills" value="JAVA SCRPT">
        <label for="javascript"> JAVA SCRIPT </label>

        <input type="checkbox" id="react" name="skills" value="REACT">
        <label for="react"> REACT </label>
        <br><br>

        <label for="address">ADDRESS : </label>
        <br>

        <textarea name="address" name="address" id="address" rows="5" cols="30"></textarea>
        <br><br>

        <button type="submit"> Submit </button>
        <button type="reset"> Reset </button>






    </form>

</body>

</html>
