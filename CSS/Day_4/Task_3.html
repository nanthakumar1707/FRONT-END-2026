<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 3 - Product Boxes</title>

    <style>
        .product {
            width: 250px;
            padding: 20px;
            border: 3px solid black;
            margin: 20px;
            background-color: lightyellow;
        }

        .product1 {
            padding: 10px;
            margin: 10px;
        }

        .product2 {
            padding: 25px;
            margin: 25px;
        }

        .product3 {
            padding: 35px;
            margin: 35px;
        }
    </style>
</head>

<body>

    <h1>Product Details</h1>

    <div class="product product1">

        <h2>Laptop</h2>

        <p><strong>Price:</strong> ₹50,000</p>

        <p>
            A powerful laptop for programming and development.
        </p>

    </div>


    <div class="product product2">

        <h2>Mobile Phone</h2>

        <p><strong>Price:</strong> ₹25,000</p>

        <p>
            A modern smartphone with a high-quality display.
        </p>

    </div>


    <div class="product product3">

        <h2>Headphones</h2>

        <p><strong>Price:</strong> ₹2,000</p>

        <p>
            Wireless headphones with clear sound quality.
        </p>

    </div>

</body>
</html>
