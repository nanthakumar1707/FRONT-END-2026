<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model</title>

    <style>
        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main Heading */
        h1 {
            text-align: center;
            margin: 30px;
        }

        /* Container */
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* BOX MODEL */
        .box {
            width: 300px;
            /* Content */
            padding: 20px;
            /* Padding */
            border: 5px solid black;
            /* Border */
            margin: 10px;
            /* Margin */

            background-color: white;
            text-align: center;

            border-radius: 10px;

            /* Shadow for the box */
            box-shadow: 5px 5px 15px gray;
        }

        /* Image */
        .box img {
            width: 220px;
            height: 220px;

            object-fit: contain;

            cursor: pointer;

            /* Image shadow */
            box-shadow: 3px 3px 10px gray;

            border-radius: 10px;
        }

        /* Shadow when image is clicked */
        .box img:active {
            box-shadow: 10px 10px 25px black;
        }

        h2 {
            margin: 15px;
        }

        p {
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>My Products</h1>

    <div class="container">

        <!-- Box 1 -->
        <div class="box">
            <img src="Asseds/images/2.svg" alt="Product 1">

            <h2>Product 1</h2>

            <p>Fresh Product</p>
            <p>Price: ₹100</p>
        </div>


        <!-- Box 2 -->
        <div class="box">
            <img src="Asseds/images/3.svg" alt="Product 2">

            <h2>Product 2</h2>

            <p>Fresh Product</p>
            <p>Price: ₹120</p>
        </div>


        <!-- Box 3 -->
        <div class="box">
            <img src="Asseds/images/4.svg" alt="Product 3">

            <h2>Product 3</h2>

            <p>Fresh Product</p>
            <p>Price: ₹150</p>
        </div>


        <!-- Box 4 -->
        <div class="box">
            <img src="Asseds/images/5.svg" alt="Product 4">

            <h2>Product 4</h2>


            <p>Fresh Product</p>
            <p>Price: ₹130</p>
        </div>

    </div>

</body>

</html>
