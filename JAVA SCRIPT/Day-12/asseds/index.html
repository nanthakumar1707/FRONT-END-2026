<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript DOM Practice</title>
</head>

<body>

    <!-- TASK 1 – CHANGE HEADING TEXT -->

    <h1 id="title">Original Heading</h1>


    <!-- TASK 2 – CHANGE PARAGRAPH STYLES -->

    <p class="para">This is paragraph 1.</p>

    <p class="para">This is paragraph 2.</p>

    <p class="para">This is paragraph 3.</p>


    <!-- TASK 3 – UPDATE IMAGE AND LINK -->

    <h2>Image and Link</h2>

    <img id="myImage" src="https://placehold.co/400x300" alt="Sample Image">

    <br><br>

    <a id="myLink" href="#">
        Original Link
    </a>


    <!-- TASK 4 – UPDATE INPUT PROPERTIES -->

    <h2>Input Details</h2>

    <label>Username:</label>
    <input type="text" id="username" placeholder="Enter username">

    <br><br>

    <label>Email:</label>
    <input type="email" id="email" placeholder="Enter email">

    <br><br>

    <button id="submitBtn">
        Submit
    </button>


    <!-- TASK 5 – UPDATE MULTIPLE ELEMENTS -->

    <h2>Technologies</h2>

    <h3 class="heading">Heading 1</h3>
    <h3 class="heading">Heading 2</h3>
    <h3 class="heading">Heading 3</h3>
    <h3 class="heading">Heading 4</h3>
    <h3 class="heading">Heading 5</h3>


    <!-- JavaScript file -->
    <!-- IMPORTANT: Keep this at the bottom -->

    <script src="script.js"></script>

</body>

</html>
