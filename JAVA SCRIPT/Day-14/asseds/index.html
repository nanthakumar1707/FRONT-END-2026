<!DOCTYPE html>
<html>

<head>
    <title>JavaScript DOM Tasks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #box {
            width: 200px;
            height: 100px;
            background-color: white;
            border: 1px solid black;
            margin: 10px;
            padding: 10px;
        }

        .dark {
            background-color: black;
            color: white;
        }

        .light {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>

    <h1>JavaScript DOM Practice Tasks</h1>

    <!-- TASK 1 -->
    <h2>Task 1 - Change Heading Color</h2>

    <h1 id="heading1">Hello World</h1>
    <button id="btn1">Change Color</button>

    <hr>

    <!-- TASK 2 -->
    <h2>Task 2 - Change Box Background</h2>

    <div id="box">Color Box</div>
    <button id="btn2">Blue</button>
    <button id="btn3">Yellow</button>

    <hr>

    <!-- TASK 3 -->
    <h2>Task 3 - Show and Hide</h2>

    <p id="para1">This is a sample paragraph.</p>
    <button id="btn4">Hide</button>
    <button id="btn5">Show</button>

    <hr>

    <!-- TASK 4 -->
    <h2>Task 4 - Toggle Show / Hide</h2>

    <h3 id="heading2">Toggle This Heading</h3>
    <button id="btn6">Toggle</button>

    <hr>

    <!-- TASK 5 -->
    <section id="theme" class="light">
        <h2>Task 5 - Dark Mode / Light Mode</h2>

        <h3>Welcome!</h3>
        <p>This is a theme toggle example.</p>

        <button id="btn7">Toggle Theme</button>
    </section>

    <script src="script.js"></script>

</body>

</html>
